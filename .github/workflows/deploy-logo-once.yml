name: One-off Logo Deploy

on:
  workflow_dispatch:

jobs:
  deploy-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage logo files
        run: |
          mkdir -p deploy-tmp
          cp img/logo-ppm.png img/logo-ppm.webp deploy-tmp/

      - name: Deploy logo via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./deploy-tmp/
          server-dir: ./img/
          dangerous-clean-slate: false
          dry-run: false
